name: RAG quality

# Answer quality is not covered by the unit tests: a wrong answer is a plausible
# sentence, not a crash. This workflow measures it end to end -- generation and
# faithfulness judging included -- which costs real money, so it runs nightly
# rather than per pull request.
#
# The pull-request gate lives in ci.yml as the `quality` job, which the Docker
# build depends on. It has to: a workflow that nothing depends on blocks nothing
# when it goes red, so a gate here alone would have been decorative.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  quality:
    name: Retrieval & answer quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: safeshield
          POSTGRES_PASSWORD: safeshield
          POSTGRES_DB: safeshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safeshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://safeshield:safeshield@localhost:5432/safeshield
      JWT_SECRET: eval-only-secret
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Build schema
        run: alembic upgrade head

      - name: Index the sample corpus
        run: python scripts/seed_corpus.py

      - name: Require an API key
        # The whole point of this workflow is the answer metrics, and those need
        # a key. Failing here is correct: silently degrading to a mode that
        # measures nothing and reporting success is how a gate becomes theatre.
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not available; the nightly quality run cannot measure answers."
            exit 1
          fi

      - name: Evaluate
        id: eval
        run: python eval/run_eval.py --check | tee /tmp/eval.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## RAG quality (full: retrieval + answers)"
            echo ""
            echo '```'
            sed -n '/^=\{20,\}/,$p' /tmp/eval.txt || cat /tmp/eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval/results/
          if-no-files-found: ignore
