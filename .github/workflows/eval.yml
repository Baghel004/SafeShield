name: RAG quality

# Retrieval and answer quality are not covered by the unit tests: a wrong answer
# is a plausible sentence, not a crash. This workflow measures them.
#
# Pull requests run retrieval only -- no API key, no spend, and it still catches
# the failure that matters most, because a chunk that is never retrieved cannot
# be answered from. The full run, including answer faithfulness, happens nightly
# and on demand where the secret is available.

on:
  pull_request:
    paths:
      - "backend/app/rag/**"
      - "backend/app/api/chat.py"
      - "backend/eval/**"
      - ".github/workflows/eval.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Include answer generation and faithfulness judging"
        type: boolean
        default: true

jobs:
  quality:
    name: Retrieval & answer quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: safeshield
          POSTGRES_PASSWORD: safeshield
          POSTGRES_DB: safeshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safeshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://safeshield:safeshield@localhost:5432/safeshield
      JWT_SECRET: eval-only-secret
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Build schema
        run: alembic upgrade head

      - name: Index the sample corpus
        # Without a key this seeds with deterministic fake embeddings, which is
        # fine for a smoke check but makes dense retrieval meaningless -- hence
        # the retrieval-only gate below is skipped in that case.
        run: python scripts/seed_corpus.py

      - name: Decide which mode to run
        id: mode
        run: |
          if [ -n "$OPENAI_API_KEY" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "args=--check" >> "$GITHUB_OUTPUT"
            echo "mode=full (retrieval + answers)" >> "$GITHUB_OUTPUT"
          elif [ -n "$OPENAI_API_KEY" ]; then
            echo "args=--retrieval-only --check" >> "$GITHUB_OUTPUT"
            echo "mode=retrieval only (pull request: no answer spend)" >> "$GITHUB_OUTPUT"
          else
            echo "args=--retrieval-only" >> "$GITHUB_OUTPUT"
            echo "mode=smoke only (no API key: fake embeddings, gate disabled)" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate
        id: eval
        run: |
          echo "Mode: ${{ steps.mode.outputs.mode }}"
          python eval/run_eval.py ${{ steps.mode.outputs.args }} | tee /tmp/eval.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## RAG quality"
            echo ""
            echo "Mode: ${{ steps.mode.outputs.mode }}"
            echo ""
            echo '```'
            sed -n '/^=\{20,\}/,$p' /tmp/eval.txt || cat /tmp/eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval/results/
          if-no-files-found: ignore
