name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy app

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: safeshield
          POSTGRES_PASSWORD: safeshield
          POSTGRES_DB: safeshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safeshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://safeshield:safeshield@localhost:5432/safeshield
      TEST_DATABASE_URL: postgresql+psycopg://safeshield:safeshield@localhost:5432/safeshield_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Create test database
        run: PGPASSWORD=safeshield psql -h localhost -U safeshield -d safeshield -c "CREATE DATABASE safeshield_test OWNER safeshield;"

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: pytest
        run: pytest -v --tb=short

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --desc || true   # advisory until we pin a lockfile
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: safeshield-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
