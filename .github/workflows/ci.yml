name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      # Catches the failure mode where a package was pip-installed locally but
      # never added to pyproject.toml: everything works on the author's machine
      # and every job fails on a clean checkout.
      - name: Every import resolves from declared dependencies alone
        run: |
          python - <<'PY'
          import importlib, pathlib, re, sys
          roots = ["app", "run.py", "worker.py", "scripts"]
          stdlib = set(sys.stdlib_module_names)
          found, missing = set(), []
          for root in roots:
              paths = pathlib.Path(root).rglob("*.py") if pathlib.Path(root).is_dir() else [pathlib.Path(root)]
              for path in paths:
                  for line in path.read_text(encoding="utf-8").splitlines():
                      m = re.match(r"\s*(?:from|import)\s+([a-zA-Z_][\w]*)", line)
                      if m:
                          found.add(m.group(1))
          for name in sorted(found - stdlib - {"app", "tests"}):
              try:
                  importlib.import_module(name)
              except ImportError:
                  missing.append(name)
          if missing:
              print("Imported but not installed from pyproject.toml:")
              for name in missing:
                  print(f"  - {name}")
              raise SystemExit(1)
          print(f"all {len(found - stdlib)} third-party imports resolve")
          PY

      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        # Everything, not just `app`. Restricting it there left the tests, the
        # evaluation harness and the entrypoint scripts unchecked despite strict
        # mode -- and those are exactly where an unnoticed type error turns into
        # a confusing runtime failure rather than a compile-time one.
        run: mypy app tests eval scripts run.py worker.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: safeshield
          POSTGRES_PASSWORD: safeshield
          POSTGRES_DB: safeshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safeshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://safeshield:safeshield@localhost:5432/safeshield
      TEST_DATABASE_URL: postgresql+psycopg://safeshield:safeshield@localhost:5432/safeshield_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Create test database
        run: PGPASSWORD=safeshield psql -h localhost -U safeshield -d safeshield -c "CREATE DATABASE safeshield_test OWNER safeshield;"

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Confirm pgvector is present
        run: |
          PGPASSWORD=safeshield psql -h localhost -U safeshield -d safeshield_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "SELECT extversion FROM pg_extension WHERE extname='vector';"

      - name: pytest
        run: pytest -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  quality:
    name: RAG quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: safeshield
          POSTGRES_PASSWORD: safeshield
          POSTGRES_DB: safeshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safeshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://safeshield:safeshield@localhost:5432/safeshield
      JWT_SECRET: eval-only-secret
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Build schema
        run: alembic upgrade head

      - name: Index the sample corpus
        run: python scripts/seed_corpus.py

      # Two gates, because they measure different things. With a key, retrieval
      # is scored against the committed baseline and a regression fails the
      # build. Without one -- fork pull requests, where secrets are unavailable
      # -- embeddings are deterministic noise and every ranking metric is
      # meaningless, so the smoke gate asserts the pipeline still returns
      # results at all. Neither case is allowed to pass by doing nothing.
      - name: Evaluate retrieval
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "Mode: retrieval quality vs baseline"
            python eval/run_eval.py --retrieval-only --check
          else
            echo "Mode: smoke only (no API key available)"
            python eval/run_eval.py --retrieval-only --smoke
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  ops:
    name: Ops config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A broken alert rule is silent: Prometheus loads what it can and skips
      # the rest, so the alert that was supposed to page simply never fires.
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Compose files are valid
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          # The production overlay uses !reset and !override, which only newer
          # compose understands -- and a syntax error here would surface during
          # a deploy rather than now.
          POSTGRES_PASSWORD=x JWT_SECRET=$(head -c 48 /dev/urandom | base64) \
          OPENAI_API_KEY=sk-dummy CORS_ORIGINS='["https://example.com"]' \
          DATABASE_URL='postgresql+psycopg://u:p@postgres:5432/db' \
          POSTGRES_EXPORTER_DSN='postgresql://u:p@postgres:5432/db?sslmode=disable' \
          GRAFANA_PASSWORD=x \
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null

      - name: Grafana dashboards are valid JSON
        run: |
          for f in ops/grafana/dashboards/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Helm chart lints and renders
        run: |
          helm lint deploy/helm/safeshield \
            --set image.tag=ci --set config.storage.bucket=b --set ingress.host=ci.example.com
          helm template safeshield deploy/helm/safeshield \
            --set image.tag=ci \
            --set config.storage.bucket=safeshield-uploads \
            --set ingress.host=api.example.com \
            --set 'config.corsOrigins[0]=https://example.com' > /tmp/rendered.yaml
          grep -c '^kind:' /tmp/rendered.yaml

      - name: Chart refuses a mutable image tag
        # The guard is the point: a moving tag makes a rollback meaningless,
        # because the tag has already moved to the thing being rolled back
        # from. Asserting the failure keeps someone from "fixing" it later.
        run: |
          if helm template safeshield deploy/helm/safeshield \
               --set config.storage.bucket=b --set ingress.host=x.example.com 2>/dev/null; then
            echo "chart rendered without an explicit image.tag -- the guard is gone"
            exit 1
          fi
          echo "ok: rendering fails without an explicit tag"

      - name: Manifests match the Kubernetes schema
        run: |
          docker run --rm -v /tmp:/work -w /work ghcr.io/yannh/kubeconform:latest \
            -strict -summary -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3

      - name: Terraform is formatted and valid
        run: |
          # Both root modules: the backend (EKS) and the frontend (S3 +
          # CloudFront). fmt is checked once across the tree; validate runs per
          # module because each has its own providers.
          terraform fmt -check -recursive deploy/
          for dir in deploy/terraform deploy/terraform-frontend; do
            echo "== $dir =="
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

      - name: Deploy scripts pass shellcheck
        run: |
          # A bug in down.sh is the expensive kind: it fails to tear something
          # down and the stack keeps billing. shellcheck catches the obvious
          # ones before they run against a live account.
          docker run --rm -v "$PWD:/work" -w /work koalaman/shellcheck:stable \
            deploy/scripts/up.sh deploy/scripts/down.sh deploy/scripts/deploy-frontend.sh

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --desc || true   # advisory until we pin a lockfile
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test, quality, frontend, ops]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: safeshield-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
