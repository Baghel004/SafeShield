services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: safeshield
      POSTGRES_PASSWORD: safeshield
      POSTGRES_DB: safeshield
    # Host port is configurable: a locally-installed Postgres already holding
    # 5432 will silently shadow this container and you end up querying the wrong
    # database. Set POSTGRES_PORT to move it.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeshield -d safeshield"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://safeshield:safeshield@postgres:5432/safeshield
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      # Was missing, which meant the API silently used fake embeddings for
      # query vectors while the worker indexed with real ones -- dense
      # retrieval compares vectors from two different spaces and returns
      # nonsense, with nothing raising an error anywhere.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEBUG: "true"
      RELOAD: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # The shared sample corpus lives outside the backend directory, so the
      # source mount alone does not bring it in and seed_corpus.py finds an
      # empty directory -- every question then refuses, correctly but
      # uselessly.
      - ./datasets:/datasets:ro
    command: >
      sh -c "alembic upgrade head && python run.py"

  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://safeshield:safeshield@postgres:5432/safeshield
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./datasets:/datasets:ro
    command: python worker.py

  # --- monitoring ---------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      # Local only. The production profile requires a real password and does
      # not enable anonymous access.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://safeshield:safeshield@postgres:5432/safeshield?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  promdata:
  grafanadata:
