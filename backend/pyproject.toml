[project]
name = "safeshield"
version = "0.1.0"
description = "RAG-powered insurance policy assistant"
requires-python = ">=3.12"
dependencies = [
    # --- web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",     # multipart/form-data uploads
    "slowapi>=0.1.9",               # rate limiting
    # --- database ---
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",         # sync + async under one URL scheme
    "alembic>=1.14",
    "pgvector>=0.3",                # Vector column type
    # --- auth ---
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "email-validator>=2.2",         # EmailStr validation
    # --- background jobs ---
    "arq>=0.26",
    # --- RAG pipeline ---
    "pdfplumber>=0.11",             # PDF text and table extraction
    "tiktoken>=0.8",                # token counting for chunk sizing
    "openai>=1.60",                 # embeddings + answer generation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0",        # eval golden set
    "types-PyYAML>=6.0",  # so eval/ type-checks under strict mode
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded test passwords are intentional
"alembic/*" = ["N999", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

# Tests are type-checked, but not required to annotate every test function and
# fixture. Annotating `def test_x() -> None` 150 times finds no bugs; what does
# find bugs is checking the bodies, which still happens here -- a test calling a
# function with the wrong argument type is exactly the kind of mistake that
# otherwise shows up as a confusing runtime failure.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/compat.py"]  # event-loop plumbing, exercised by running at all
# SQLAlchemy's async layer runs application code inside greenlets. Without this
# the tracer loses those frames and every endpoint body that awaits the database
# is reported as unexecuted -- list/get/delete were all thoroughly tested and
# all showed uncovered. It also measured differently per platform, which is how
# a floor set from a local run failed in CI.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# A floor, not a target. It exists so a change that guts test coverage fails
# rather than passing quietly; chasing the number for its own sake produces
# tests that assert nothing.
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
