# ---------------------------------------------------------------- must refuse
# The corpus cannot answer these. Refusing is the correct behaviour, and a
# confident invented answer is the single worst failure this system can produce.
- id: refuse-capital-of-france
  question: "What is the capital city of France?"
  should_refuse: true

- id: refuse-stock-advice
  question: "Which technology stocks should I buy this quarter?"
  should_refuse: true

- id: refuse-car-insurance
  question: "What is the no-claim bonus on my Honda City car insurance policy?"
  should_refuse: true
  note: Plausibly insurance-shaped, but these are health and travel policies. Topic adjacency must not be mistaken for coverage.

- id: refuse-my-premium
  question: "How much is my monthly premium and when is it due?"
  should_refuse: true
  note: Policy wordings contain no individual customer data. Answering would mean inventing it.
