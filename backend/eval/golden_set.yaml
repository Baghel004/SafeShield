# ---------------------------------------------------------------- exclusions
- id: exclusion-cataract
  question: "Is cataract treatment excluded from cover?"
  expect_content:
    - "cataract"
  expect_terms: []
  expect_sources: [BAJHLIP23020V012223.pdf, HDFHLIP23024V072223.pdf]
  note: >
    A live failure mode. Cataract is a specified condition with a waiting
    period, not a permanent exclusion, and the model has previously answered
    "excluded" outright. Faithfulness scoring is what catches that.

