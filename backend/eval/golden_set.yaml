# Golden set for retrieval and answer quality.
#
# Every case was written by reading the source documents, not generated from the
# chunks. That matters: a question generated from a chunk reuses its wording, so
# retrieval finds it trivially and the score flatters the system. These are
# phrased the way someone with a policy question would actually phrase them —
# "what happens if I don't claim for a year", not "cumulative bonus" — which is
# precisely the vocabulary mismatch retrieval has to bridge.
#
# Fields:
#   question       what the user asks
#   expect_terms   strings that must appear in a correct answer (usually the
#                  figure). Matched case-insensitively.
#   expect_sources documents any of which retrieval should surface. Pages are a
#                  hint for humans; scoring is per document, because the same
#                  clause legitimately appears on several pages and across
#                  insurers.
#   should_refuse  true when the corpus cannot answer it and the correct
#                  behaviour is to say so.
#   note           why this case exists, where it is not obvious.

# ---------------------------------------------------------------- waiting periods
- id: waiting-initial-30-day
  question: "If I just bought the policy, how soon can I claim for an illness?"
  expect_content:
    - "30 days from the first policy commencement"
  expect_terms: ["30 days"]
  expect_sources: [HDFHLIP23024V072223.pdf, BAJHLIP23020V012223.pdf]
  note: User says "how soon can I claim"; the document says "30-day waiting period".

- id: waiting-specified-disease
  question: "Is there a waiting period before listed conditions like hernia or cataract are covered?"
  expect_content:
    - "expiry of 24 months of continuous coverage"
  expect_terms: ["24 months"]
  expect_sources: [BAJHLIP23020V012223.pdf, HDFHLIP23024V072223.pdf]

- id: waiting-pre-existing
  question: "I was diagnosed with diabetes before taking the policy. How is that treated?"
  expect_content:
    - "pre-existing disease"
  expect_terms: []
  expect_sources: [CHOTGDP23004V012223.pdf, BAJHLIP23020V012223.pdf]
  note: Tests that "diagnosed before taking the policy" retrieves the pre-existing disease definition.

- id: waiting-maternity
  question: "How long must I hold the policy before maternity expenses are payable?"
  expect_content:
    - "maternity expenses"
  expect_terms: []
  expect_sources: [BAJHLIP23020V012223.pdf, HDFHLIP23024V072223.pdf]
  note: Figure varies by plan, so only the source is scored — asserting one number would be wrong.

