apiVersion: v1
kind: Service
metadata:
  name: {{ include "safeshield.fullname" . }}-api
  labels:
    {{- include "safeshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "safeshield.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "safeshield.fullname" . }}-worker
  labels:
    {{- include "safeshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # Headless: nothing routes traffic to the worker, it pulls from the queue.
  # This Service exists only so Prometheus has something to discover.
  clusterIP: None
  ports:
    - port: 9100
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "safeshield.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
