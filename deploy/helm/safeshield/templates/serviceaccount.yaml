{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "safeshield.serviceAccountName" . }}
  labels:
    {{- include "safeshield.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    # Terraform sets eks.amazonaws.com/role-arn here. That annotation is what
    # lets the pod reach S3 with a short-lived assumed role instead of a static
    # access key sitting in a Secret, which would be one more credential to
    # rotate and one more thing to leak.
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application never calls the Kubernetes API, so the default token is not
# mounted. This is separate from IRSA: the EKS pod-identity webhook injects its
# own projected volume with an sts.amazonaws.com audience, which this flag does
# not control. Worth confirming on a real cluster the first time -- if the pod
# cannot reach S3, this is the first thing to test by flipping it to true.
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
