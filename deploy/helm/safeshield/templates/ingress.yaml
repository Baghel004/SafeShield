{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "safeshield.fullname" . }}
  labels:
    {{- include "safeshield.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ required "ingress.host must be set when TLS is enabled" .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      http:
        paths:
          # /api only. /metrics is deliberately not routed: it names internal
          # routes and exposes traffic patterns, and it has no authentication.
          # Prometheus scrapes it in-cluster.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "safeshield.fullname" . }}-api
                port:
                  number: {{ .Values.service.port }}
{{- end }}
